name: deploy-site
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Import large media files
        if: hashFiles('videos/work-04.mp4') == ''
        run: |
          curl -fsSL -o /tmp/s.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3KXs4GUTt01aKFgydxDk0mn9qU6/ab962531-7bbf-43b7-8a8b-7a73354d372e.zip"
          unzip -o /tmp/s.zip -d .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add media files" || true
          git push
      - name: Import media update nov6
        if: hashFiles('videos/work-33.mp4') == ''
        run: |
          curl -fsSL -o /tmp/m.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3KXs4GUTt01aKFgydxDk0mn9qU6/5b2a9d7f-78ae-4546-9a1a-8c98e04c27e1.zip"
          curl -fsSL -o /tmp/i.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3KXs4GUTt01aKFgydxDk0mn9qU6/77ac0156-8c4d-4bee-90c2-cf551ce01867.zip"
          unzip -o /tmp/m.zip -d .
          unzip -o /tmp/i.zip -d .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "2s logo on all videos + 12 new videos" || true
          git push
      - name: Import ring wall music update
        if: hashFiles('videos/m27.txt') == ''
        run: |
          curl -fsSL -o /tmp/r.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3KXs4GUTt01aKFgydxDk0mn9qU6/a01f83c6-d063-414c-9c3d-569f5bc9ac3c.zip"
          unzip -o /tmp/r.zip -d .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Ring wall: original music" || true
          git push
      - name: Import batch 5 videos
        if: hashFiles('videos/b5.txt') == ''
        run: |
          curl -fsSL -o /tmp/b5.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3KXs4GUTt01aKFgydxDk0mn9qU6/4084b5a5-f4e6-493d-93b8-a2061bef9516.zip"
          unzip -o /tmp/b5.zip -d .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Batch 5: cafe, armchair (Bar), LOVE rings" || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
