<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>תמונות המוצר | BOOST MEDIA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#131416;color:#F4F4F2;font-family:Heebo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.brand{display:flex;align-items:center;gap:10px;direction:ltr;justify-content:flex-end;font-weight:800;font-size:1.0625rem}
.brand i{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#D9FE16;color:#131416;font-style:normal;font-size:.9375rem}
h1{font-size:1.75rem;font-weight:900;line-height:1.15;margin:22px 0 6px}
.meta{color:#A6A8AB;font-size:.9375rem;margin:0 0 16px}
.st{display:inline-block;padding:8px 16px;border-radius:999px;font-weight:800;font-size:1rem;margin-bottom:16px}
.st.ok{background:#D9FE16;color:#131416}.st.no{background:rgba(255,184,107,.14);color:#FFB86B}.st.wait{background:#1F1F21;color:#A6A8AB}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid a{position:relative;display:block;border-radius:16px;overflow:hidden;background:#1F1F21;aspect-ratio:1}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid span{color:#F4F4F2;position:absolute;bottom:8px;right:8px;background:rgba(19,20,22,.8);border-radius:999px;padding:3px 10px;font-size:.8125rem;font-weight:700}
.add{margin-top:22px;padding:16px;border-radius:18px;background:#1F1F21}
.add b{display:block;font-size:1.125rem;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{white-space:nowrap;appearance:none;border:0;min-height:52px;padding:0 20px;border-radius:14px;font:800 1rem Heebo,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:1}
.btn.p{background:#D9FE16;color:#131416}.btn.s{background:#2A2B2D;color:#F4F4F2}
.btn:active{transform:scale(.97)}.btn:focus-visible,a:focus-visible{outline:3px solid #D9FE16;outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#msg{margin:12px 0 0;color:#D9FE16;font-weight:700;min-height:1.4em}
.lk{display:inline-block;margin-top:22px;color:#F4F4F2;font-weight:700}
</style></head><body><main>
<div class="brand"><span>BOOST MEDIA</span><i>BM</i></div>
<h1>תמונות המוצר</h1>
<p class="meta" id="meta"></p>
<div class="st wait" id="st" role="status">טוען…</div>
<div class="grid" id="grid"></div>
<div class="add"><b>הוספת תמונה</b>
  <div class="row"><label class="btn p">תמונת תכשיט<input type="file" accept="image/*" multiple data-k="תכשיט"></label><label class="btn s">לוגו<input type="file" accept="image/*" data-k="לוגו"></label></div>
  <p id="msg" role="status"></p></div>
<a class="lk" id="vid" hidden>לצפייה בסרטון שנבחר</a>
</main>
<script>
(function(){var GAS='https://script.google.com/macros/s/AKfycbzM_0SBGDB1Wn-U22q9M6jiORgG6Bwj_RqwTSDb7QJOU0RZcNjfg6CRo2CZiBV5_SCynw/exec',q=new URLSearchParams(location.search),o=q.get('o')||'',i=q.get('i')||'';
  var st=document.getElementById('st'),grid=document.getElementById('grid'),msg=document.getElementById('msg');
  var ok=/^BM-\d{4}-\d{4}$/.test(o)&&/^[a-z0-9-]{1,24}$/.test(i);
  if(!ok){st.className='st no';st.textContent='הקישור לא תקין';document.querySelector('.add').hidden=true;return;}
  var m=i.match(/^([vp])(\d+)/);document.getElementById('meta').textContent='הזמנה '+o+(m?' · '+(m[1]==='v'?'סרטון':'תמונת קמפיין'):'');
  if(m&&m[1]==='v'){var a=document.getElementById('vid');a.href='./?v='+m[2];a.hidden=false;}
  function show(files){grid.textContent='';var n=0,lg=0;files.forEach(function(f){if(f.kind==='לוגו')lg++;else n++;
      var a=document.createElement('a');a.href='https://drive.google.com/file/d/'+f.id+'/view';a.target='_blank';a.rel='noopener';
      var im=document.createElement('img');im.loading='lazy';im.alt=f.kind||'תמונת מוצר';im.src='https://drive.google.com/thumbnail?id='+f.id+'&sz=w1000';a.appendChild(im);
      if(f.kind){var s=document.createElement('span');s.textContent=f.kind;a.appendChild(s);}grid.appendChild(a);});
    if(n){st.className='st ok';st.textContent=(n===1?'צורפה תמונה אחת':'צורפו '+n+' תמונות')+(lg?' · לוגו צורף':'');}
    else{st.className='st no';st.textContent='ממתין לצירוף התמונות'+(lg?' · לוגו צורף':'');document.querySelector('.add b').textContent='צרפו כאן את התמונות של התכשיט';}}
  function load(){return fetch(GAS+'?order='+o+'&item='+i).then(function(r){return r.json();}).then(function(j){show(j.files||[]);}).catch(function(){st.className='st no';st.textContent='לא הצלחתי לטעון את התמונות. נסו לרענן.';});}
  load();
  [].forEach.call(document.querySelectorAll('input[type=file]'),function(inp){inp.addEventListener('change',function(){var fs=[].slice.call(inp.files),left=fs.length,bad=0;if(!left)return;
    msg.textContent='מעלה… נשארו '+left;
    fs.forEach(function(f){var rd=new FileReader();rd.onload=function(){var b=String(rd.result);b=b.slice(b.indexOf(',')+1);
      fetch(GAS,{method:'POST',body:JSON.stringify({order:o,item:i,kind:inp.dataset.k,name:f.name||'photo',type:f.type||'image/jpeg',data:b})}).then(function(r){return r.json();}).then(function(j){if(!j.ok)bad++;}).catch(function(){bad++;})
        .then(function(){left--;msg.textContent=left?'מעלה… נשארו '+left:(bad?'חלק מהתמונות לא עלו. נסו שוב.':'התמונות נוספו.');if(!left){inp.value='';load();}});};rd.readAsDataURL(f);});});});
})();
</script></body></html>
