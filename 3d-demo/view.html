<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360°</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  model-viewer{width:100%;height:100%;--poster-color:transparent;--progress-bar-color:#111}
  .ar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);border:0;border-radius:999px;padding:11px 18px;background:#111;color:#fff;font:600 14px system-ui,sans-serif;display:flex;gap:8px;align-items:center}
  .badge{position:absolute;top:12px;right:12px;background:rgba(17,17,17,.78);color:#fff;font:600 12px system-ui,sans-serif;padding:6px 10px;border-radius:999px;pointer-events:none}
  .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(17,17,17,.72);color:#fff;font:500 14px system-ui,sans-serif;padding:10px 16px;border-radius:999px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
  .hint.off{opacity:0}
</style>
</head>
<body>
<model-viewer id="mv" dir="ltr" camera-orbit="0deg 75deg 115%" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="2500" interaction-prompt="none"
  shadow-intensity="0.5" exposure="1.0" environment-image="neutral" min-camera-orbit="auto auto 2%"
  ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" alt="תכשיט בתלת מימד">
  <button slot="ar-button" class="ar" dir="rtl">צפו בתכשיט על השולחן</button>
  <div class="badge">360°</div>
  <div class="hint" id="hint" dir="rtl">גררו לסיבוב · צבטו להגדלה</div>
</model-viewer>
<script>
  var MODELS = { topaz: ["topaz/ring.glb","topaz/ring.usdz"], gold: ["gold/ring2.glb",""], demo: ["ring.glb",""] };
  var key = new URLSearchParams(location.search).get("m") || "topaz";
  var m = MODELS[key] || MODELS.topaz, mv = document.getElementById("mv");
  if (m[1]) mv.setAttribute("ios-src", m[1]);
  if (key==="gold"){ mv.setAttribute("camera-orbit","0deg 75deg 140%"); mv.setAttribute("max-camera-orbit","Infinity 180deg 300%"); }
  mv.src = m[0];
  var hint = document.getElementById("hint");
  var hide = function(){ hint.classList.add("off"); };
  mv.addEventListener("camera-change", function(e){ if (e.detail && e.detail.source === "user-interaction") hide(); });
  setTimeout(hide, 4000);
</script>
</body>
</html>
