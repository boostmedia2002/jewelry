<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D View</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#fff}
  model-viewer{width:100%;height:100%;--poster-color:transparent}
  .ar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);border:0;border-radius:999px;padding:10px 18px;background:#111;color:#fff;font:600 14px system-ui,sans-serif}
  .tag{position:absolute;right:12px;top:10px;font:600 12px system-ui,sans-serif;color:#888;pointer-events:none}
</style>
</head>
<body>
<model-viewer id="mv" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1500"
  shadow-intensity="0.5" exposure="1.0" environment-image="neutral" min-camera-orbit="auto auto 2%"
  ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" alt="3D jewelry">
  <button slot="ar-button" class="ar">View in your space (AR)</button>
  <div class="tag">360°</div>
</model-viewer>
<script>
  var MODELS = { topaz: ["topaz/ring.glb","topaz/ring.usdz"], demo: ["ring.glb",""] };
  var key = new URLSearchParams(location.search).get("m") || "topaz";
  var m = MODELS[key] || MODELS.topaz, mv = document.getElementById("mv");
  if (m[1]) mv.setAttribute("ios-src", m[1]);
  mv.src = m[0];
</script>
</body>
</html>
