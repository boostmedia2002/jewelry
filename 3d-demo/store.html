<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טבעת טופז כחול עם הילה – לונה תכשיטים (דוגמה)</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  :root{--ink:#1a1a1a;--muted:#6f6a63;--line:#ebe6df;--bg:#fbf9f6;--gold:#b08d57}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:#fff}
  .logo{font-weight:800;letter-spacing:.08em;font-size:20px}
  .nav{display:flex;gap:20px;color:var(--muted);font-size:14px}
  .demo-note{background:#111;color:#fff;text-align:center;font-size:13px;padding:6px}
  main{max-width:1100px;margin:0 auto;padding:28px 20px 60px;display:grid;grid-template-columns:1.15fr 1fr;gap:40px}
  @media (max-width:820px){main{grid-template-columns:1fr;gap:20px;padding-top:16px}.nav{display:none}}
  .stage{position:relative;aspect-ratio:1/1;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .stage img,.stage model-viewer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .stage model-viewer{--poster-color:transparent}
  .thumbs{display:flex;gap:10px;margin-top:12px}
  .thumb{width:76px;height:76px;border-radius:12px;border:2px solid transparent;background:#fff;overflow:hidden;cursor:pointer;padding:0;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb.on{border-color:var(--ink)}
  .thumb.spin{display:flex;align-items:center;justify-content:center;flex-direction:column;font:700 15px system-ui,sans-serif;color:var(--ink);border-color:var(--line)}
  .thumb.spin.on{border-color:var(--ink)}
  .thumb.spin small{font-weight:500;font-size:11px;color:var(--muted)}
  .ar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);border:0;border-radius:999px;padding:11px 18px;background:#111;color:#fff;font:600 14px system-ui,sans-serif}
  .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(17,17,17,.72);color:#fff;font:500 14px system-ui,sans-serif;padding:10px 16px;border-radius:999px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
  .hint.off{opacity:0}
  h1{font-size:28px;line-height:1.25;margin:4px 0 6px}
  .price{font-size:24px;font-weight:700;margin:6px 0 18px}
  .muted{color:var(--muted);font-size:14px}
  .tag{display:inline-block;font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 10px}
  label{display:block;font-size:14px;margin:18px 0 6px}
  select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:15px;background:#fff}
  .buy{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:700 16px system-ui,sans-serif}
  ul{padding-right:18px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="demo-note">דף דוגמה – כך תמונת 360 נראית בתוך חנות אונליין</div>
<header><div class="logo">LUNA</div><nav class="nav"><span>טבעות</span><span>שרשראות</span><span>עגילים</span><span>צמידים</span></nav></header>
<main>
  <section>
    <div class="stage" id="stage">
      <img id="photo" src="topaz-photo.jpg" alt="טבעת טופז כחול עם הילה">
    </div>
    <div class="thumbs">
      <button class="thumb on" id="t-photo" aria-label="תמונה"><img src="topaz-photo.jpg" alt=""></button>
      <button class="thumb spin" id="t-360" aria-label="צפייה ב-360">360°<small>סובבו</small></button>
    </div>
  </section>
  <section>
    <span class="tag">חדש בקולקציה</span>
    <h1>טבעת טופז כחול עם הילה</h1>
    <div class="muted">זהב לבן 14K · טופז כחול אובלי · הילת יהלומים</div>
    <div class="price">₪3,290</div>
    <div class="muted">לחצו על <b>360°</b> כדי לסובב את הטבעת ולראות אותה מכל הכיוונים.</div>
    <label for="size">מידה</label>
    <select id="size"><option>בחרי מידה</option><option>48</option><option>50</option><option>52</option><option>54</option><option>56</option></select>
    <button class="buy" type="button">הוספה לסל</button>
    <ul><li>משלוח חינם עד הבית</li><li>החלפת מידה ללא עלות</li><li>תעודת אחריות</li></ul>
  </section>
</main>
<script>
  var stage = document.getElementById("stage"), photo = document.getElementById("photo");
  var tPhoto = document.getElementById("t-photo"), t360 = document.getElementById("t-360"), mv = null;
  function show360(){
    if (!mv) {
      mv = document.createElement("model-viewer"); mv.setAttribute("dir","ltr"); mv.setAttribute("camera-orbit","0deg 75deg 115%");
      mv.setAttribute("src","topaz/ring.glb"); mv.setAttribute("ios-src","topaz/ring.usdz");
      ["camera-controls","auto-rotate","ar"].forEach(function(a){ mv.setAttribute(a,""); });
      mv.setAttribute("touch-action","pan-y"); mv.setAttribute("interaction-prompt","none");
      mv.setAttribute("auto-rotate-delay","2500"); mv.setAttribute("environment-image","neutral");
      mv.setAttribute("shadow-intensity","0.5"); mv.setAttribute("min-camera-orbit","auto auto 2%");
      mv.setAttribute("ar-modes","scene-viewer webxr quick-look"); mv.setAttribute("ar-scale","fixed");
      mv.setAttribute("alt","טבעת טופז כחול בתלת מימד");
      mv.innerHTML = '<button slot="ar-button" class="ar" dir="rtl">צפו בטבעת על השולחן</button><div class="hint" id="hint" dir="rtl">גררו לסיבוב · צבטו להגדלה</div>';
      stage.appendChild(mv);
      var hint = mv.querySelector("#hint"), hide = function(){ hint.classList.add("off"); };
      mv.addEventListener("camera-change", function(e){ if (e.detail && e.detail.source === "user-interaction") hide(); });
      setTimeout(hide, 4000);
    }
    mv.style.display = "block"; photo.style.display = "none";
    t360.classList.add("on"); tPhoto.classList.remove("on");
  }
  function showPhoto(){
    if (mv) mv.style.display = "none"; photo.style.display = "block";
    tPhoto.classList.add("on"); t360.classList.remove("on");
  }
  t360.onclick = show360; tPhoto.onclick = showPhoto;
  if (new URLSearchParams(location.search).get("spin")) show360();
</script>
</body>
</html>
