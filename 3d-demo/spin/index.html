<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>צמיד 360</title><meta name="robots" content="noindex">
<style>
:root{color-scheme:dark;--bg:#2b2a29;--ink:#f3eee5;--muted:#b9b1a3}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Arial,sans-serif;overflow-x:hidden}
.w{max-width:1100px;margin:0 auto;padding:14px 16px 28px}
.st{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#4a4648;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.st:active{cursor:grabbing}.st img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transform-origin:50% 50%}
.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:999px;font-size:14px;transition:opacity .4s;white-space:nowrap}
.ld{position:absolute;top:10px;right:12px;color:var(--muted);font-size:13px}
.bar{display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:wrap}
button{font:inherit;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #555;background:#3a3836;color:var(--ink);cursor:pointer}
</style></head><body><div class="w">
<div class="st" id="st"><img id="im" alt="צמיד זהב עם עיגולי יהלומים"><div class="ld" id="ld">טוען…</div><div class="hint" id="hint">↔ גרור לסיבוב · ↕ גרור למעלה/למטה לשינוי זווית</div></div>
<div class="bar"><button id="play">▶ סיבוב אוטומטי</button><button id="top">מבט מלמעלה</button><button id="low">מבט מהצד</button><button id="home">חזרה</button></div>
</div><script>
const NS=89,NU=22,ND=15,st=document.getElementById("st"),im=document.getElementById("im");
const pad=i=>String(i).padStart(3,"0");
const S=i=>"frames/f"+pad(i+1)+".jpg", U=i=>"tilt/u"+pad(i+1)+".jpg", D=i=>"tilt/d"+pad(i+1)+".jpg";
const all=[];for(let i=0;i<NS;i++)all.push(S(i));for(let i=0;i<NU;i++)all.push(U(i));for(let i=0;i<ND;i++)all.push(D(i));
let loaded=0;const cache=all.map(s=>{const x=new Image();x.onload=x.onerror=()=>{if(++loaded>=all.length)document.getElementById("ld").remove();else document.getElementById("ld").textContent="טוען "+Math.round(loaded/all.length*100)+"%"};x.src=s;return x});
let yaw=0,tilt=0,rot=0; // tilt: 0..NU-1 up (positive), -(ND-1)..0 down
function draw(){let src;if(tilt>0)src=U(Math.min(tilt,NU-1));else if(tilt<0)src=D(Math.min(-tilt,ND-1));else src=S(yaw);
 if(im.getAttribute("src")!==src)im.src=src;im.style.transform=(tilt>=NU-1&&rot)?"rotate("+rot+"deg)":"";}
const mod=(a,n)=>((a%n)+n)%n;
let anim=null;function stopAnim(){if(anim){clearInterval(anim);anim=null}}
function animate(steps,done){stopAnim();anim=setInterval(()=>{if(!steps()){stopAnim();done&&done()}draw()},28)}
function toYaw0(done){if(yaw===0)return done&&done();const dir=yaw<NS/2?-1:1;animate(()=>{if(yaw===0)return false;yaw=mod(yaw+dir,NS);return true},done)}
function toTilt(t,done){animate(()=>{if(tilt===t)return false;tilt+=tilt<t?1:-1;return true},done)}
let down=false,sx=0,sy=0,axis=null,y0=0,t0=0,r0=0,auto=null;
st.addEventListener("pointerdown",e=>{down=true;axis=null;sx=e.clientX;sy=e.clientY;stopAuto();stopAnim();st.setPointerCapture(e.pointerId);document.getElementById("hint").style.opacity=0});
st.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy,w=st.clientWidth;
 if(!axis){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;axis=Math.abs(dx)>Math.abs(dy)?"x":"y";
   if(axis==="y"&&tilt===0&&yaw!==0){down=false;toYaw0();return}
   if(axis==="x"&&tilt!==0&&tilt<NU-1){down=false;toTilt(0);return}
   y0=yaw;t0=tilt;r0=rot}
 if(axis==="x"){if(tilt>=NU-1){rot=r0+dx*0.6}else{yaw=mod(y0+Math.round(-dx/(w/NS*1.6)),NS)}}
 else{tilt=Math.max(-(ND-1),Math.min(NU-1,t0+Math.round(-dy/(w/(NU*2.2)))));if(tilt<NU-1)rot=0}
 draw()});
["pointerup","pointercancel"].forEach(t=>st.addEventListener(t,()=>down=false));
function stopAuto(){if(auto){clearInterval(auto);auto=null;document.getElementById("play").textContent="▶ סיבוב אוטומטי"}}
document.getElementById("play").onclick=()=>{if(auto)return stopAuto();const go=()=>{auto=setInterval(()=>{if(tilt>=NU-1)rot+=2;else yaw=mod(yaw+1,NS);draw()},9000/NS);document.getElementById("play").textContent="⏸ עצור"};
 if(tilt!==0&&tilt<NU-1)toTilt(0,go);else go()};
document.getElementById("top").onclick=()=>{stopAuto();toYaw0(()=>toTilt(NU-1))};
document.getElementById("low").onclick=()=>{stopAuto();rot=0;toYaw0(()=>toTilt(-(ND-1)))};
document.getElementById("home").onclick=()=>{stopAuto();rot=0;toTilt(0)};
draw();
</script></body></html>
