<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>סקיצה בטלפון · BOOST MEDIA</title>
<script>if(matchMedia('(max-width:820px)').matches)location.replace('preview.html?me=1');</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Hanken+Grotesk:wght@800&display=swap">
<style>
html,body{height:100%;margin:0;background:#0B0B0C;font-family:Heebo,system-ui,sans-serif;color:#F4F4F2}
.stage{height:100%;display:flex;align-items:center;gap:48px;padding:16px 40px;box-sizing:border-box}
.ph{width:402px;height:min(860px,calc(100vh - 32px));border:9px solid #2E3033;border-radius:46px;overflow:hidden;background:#131416;box-shadow:0 30px 80px rgba(0,0,0,.6);flex:none}
.ph iframe{width:100%;height:100%;border:0;display:block}
.panel{display:flex;flex-direction:column;gap:26px;max-width:420px}
.panel h2{margin:0 0 10px;font-size:1rem;color:#A6A8AB;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{appearance:none;min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid #34363A;background:transparent;color:#F4F4F2;font:600 .95rem Heebo,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.opts button[aria-pressed=true]{border-color:#D9FE16;box-shadow:inset 0 0 0 1px #D9FE16}
.t{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;font:800 12px/1 "Hanken Grotesk",sans-serif;direction:ltr}
.note{color:#7C7E82;font-size:.85rem;margin:0}
</style></head>
<body><div class="stage"><div class="ph"><iframe id="f" src="preview.html?me=1" title="סקיצה של האתר בטלפון"></iframe></div>
<div class="panel">
  <div><h2>לוגו</h2><div class="opts" data-k="logo">
    <button type="button" data-v="a" aria-pressed="true"><span class="t" style="background:#D9FE16;color:#131416">BM</span>A · ריבוע ירוק</button>
    <button type="button" data-v="b" aria-pressed="false"><span class="t" style="background:#F4F4F2;color:#131416">B|M</span>B · עם קו ההחלפה</button>
    <button type="button" data-v="c" aria-pressed="false"><span style="font:800 15px 'Hanken Grotesk';direction:ltr">boost<span style="color:#D9FE16">media</span></span>C · מילה בלבד</button></div></div>
  <div><h2>הפרסומת בשלב 2</h2><div class="opts" data-k="ad">
    <button type="button" data-v="mag" aria-pressed="true">זכוכית מגדלת</button>
    <button type="button" data-v="sil" aria-pressed="false">צללית, עגילים מתחלפים</button>
    <button type="button" data-v="pearl" aria-pressed="false">עגילי הפנינה</button></div></div>
  <div><h2>מה בא אחרי הסטורי</h2><div class="opts" data-k="order">
    <button type="button" data-v="cat" aria-pressed="true">הקטלוג</button>
    <button type="button" data-v="how" aria-pressed="false">ההסבר המפורט, ואז הקטלוג</button></div></div>
  <p class="note">סקיצה בלבד. האתר החי לא השתנה.</p>
</div></div>
<script>
document.querySelectorAll('.opts').forEach(function(g){g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b);});
  var o={};o[g.dataset.k]=b.dataset.v;try{document.getElementById('f').contentWindow.pvSet(o);}catch(err){}});});
</script></body></html>
